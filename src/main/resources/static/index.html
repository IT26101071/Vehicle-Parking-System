<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking System - Part Payment Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="text-center mb-4">Parking System - Part Payment Management</h2>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <!-- Add / Update Form -->
    <div class="card shadow-sm p-4 mb-4">
        <h5 id="formTitle" class="mb-3">Create Part Payment Record</h5>
        <form id="paymentForm" class="row g-3">
            <input type="hidden" id="editMode" value="false">
            <div class="col-md-3">
                <label class="form-label">Payment ID (Optional on Create)</label>
                <input type="text" id="paymentId" class="form-control" placeholder="e.g. PAY-1001">
            </div>
            <div class="col-md-3">
                <label class="form-label">Vehicle Number *</label>
                <input type="text" id="vehicleNumber" class="form-control" placeholder="e.g. CAB-1234" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Customer Name *</label>
                <input type="text" id="customerName" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Payment Method *</label>
                <select id="paymentMethod" class="form-select" required>
                    <option value="CASH">CASH</option>
                    <option value="CARD">CARD</option>
                    <option value="BANK_TRANSFER">BANK_TRANSFER</option>
                    <option value="ONLINE">ONLINE</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Total Amount *</label>
                <input type="number" step="0.01" min="0.01" id="totalAmount" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Initial Paid Amount *</label>
                <input type="number" step="0.01" min="0" id="paidAmount" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Notes</label>
                <input type="text" id="notes" class="form-control" placeholder="Optional remarks">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary" id="submitBtn">Save Payment</button>
                <button type="button" class="btn btn-secondary d-none" id="cancelEditBtn" onclick="resetForm()">Cancel Edit</button>
            </div>
        </form>
    </div>

    <!-- Filter & Table -->
    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Part Payment Records</h5>
            <div class="d-flex gap-2">
                <select id="statusFilter" class="form-select form-select-sm" onchange="loadPayments()">
                    <option value="">All Statuses</option>
                    <option value="UNPAID">UNPAID</option>
                    <option value="PARTIAL">PARTIAL</option>
                    <option value="PAID">PAID</option>
                </select>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadPayments()">Refresh</button>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Payment ID</th>
                    <th>Vehicle</th>
                    <th>Customer</th>
                    <th>Total</th>
                    <th>Paid</th>
                    <th>Balance</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="paymentsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/part-payments';

    function showAlert(msg, type = 'success') {
        const box = document.getElementById('alertBox');
        box.textContent = msg;
        box.className = `alert alert-${type}`;
        setTimeout(() => box.classList.add('d-none'), 4000);
    }

    async function loadPayments() {
        const status = document.getElementById('statusFilter').value;
        const url = status ? `${API_URL}?status=${status}` : API_URL;
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('paymentsTableBody');
        tbody.innerHTML = '';

        data.forEach(p => {
            const badge = p.paymentStatus === 'PAID' ? 'bg-success' :
                          p.paymentStatus === 'PARTIAL' ? 'bg-warning text-dark' : 'bg-danger';
            tbody.innerHTML += `
                <tr>
                    <td><strong>${p.paymentId}</strong></td>
                    <td>${p.vehicleNumber}</td>
                    <td>${p.customerName}</td>
                    <td>${Number(p.totalAmount).toFixed(2)}</td>
                    <td>${Number(p.paidAmount).toFixed(2)}</td>
                    <td><strong>${Number(p.balanceAmount).toFixed(2)}</strong></td>
                    <td>${p.paymentMethod}</td>
                    <td><span class="badge ${badge}">${p.paymentStatus}</span></td>
                    <td>
                        ${p.paymentStatus !== 'PAID' ? `<button class="btn btn-sm btn-success me-1" onclick="payInstallment('${p.paymentId}', ${p.balanceAmount})">+ Pay</button>` : ''}
                        <button class="btn btn-sm btn-warning me-1" onclick='editPayment(${JSON.stringify(p)})'>Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePayment('${p.paymentId}')">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const isEdit = document.getElementById('editMode').value === 'true';
        const paymentId = document.getElementById('paymentId').value.trim();
        const payload = {
            paymentId: paymentId || null,
            vehicleNumber: document.getElementById('vehicleNumber').value,
            customerName: document.getElementById('customerName').value,
            totalAmount: parseFloat(document.getElementById('totalAmount').value),
            paidAmount: parseFloat(document.getElementById('paidAmount').value),
            paymentMethod: document.getElementById('paymentMethod').value,
            notes: document.getElementById('notes').value
        };

        const url = isEdit ? `${API_URL}/${paymentId}` : API_URL;
        const method = isEdit ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            showAlert(isEdit ? 'Payment record updated!' : 'Part payment created!');
            resetForm();
            loadPayments();
        } else {
            const err = await res.json();
            showAlert(err.message || 'Operation failed', 'danger');
        }
    });

    function editPayment(p) {
        document.getElementById('editMode').value = 'true';
        document.getElementById('formTitle').textContent = 'Update Part Payment Record';
        document.getElementById('paymentId').value = p.paymentId;
        document.getElementById('paymentId').readOnly = true;
        document.getElementById('vehicleNumber').value = p.vehicleNumber;
        document.getElementById('customerName').value = p.customerName;
        document.getElementById('totalAmount').value = p.totalAmount;
        document.getElementById('paidAmount').value = p.paidAmount;
        document.getElementById('paymentMethod').value = p.paymentMethod;
        document.getElementById('notes').value = p.notes || '';
        document.getElementById('submitBtn').textContent = 'Update Payment';
        document.getElementById('cancelEditBtn').classList.remove('d-none');
    }

    function resetForm() {
        document.getElementById('paymentForm').reset();
        document.getElementById('editMode').value = 'false';
        document.getElementById('formTitle').textContent = 'Create Part Payment Record';
        document.getElementById('paymentId').readOnly = false;
        document.getElementById('submitBtn').textContent = 'Save Payment';
        document.getElementById('cancelEditBtn').classList.add('d-none');
    }

    async function payInstallment(paymentId, balance) {
        const amountStr = prompt(`Enter installment amount (Remaining balance: ${balance}):`);
        if (!amountStr) return;
        const additionalAmount = parseFloat(amountStr);
        if (isNaN(additionalAmount) || additionalAmount <= 0) {
            showAlert('Invalid installment amount', 'danger');
            return;
        }
        const res = await fetch(`${API_URL}/${paymentId}/installment`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ additionalAmount, paymentMethod: 'CASH' })
        });
        if (res.ok) {
            showAlert('Installment added successfully!');
            loadPayments();
        } else {
            const err = await res.json();
            showAlert(err.message || 'Failed to add installment', 'danger');
        }
    }

    async function deletePayment(paymentId) {
        if (!confirm(`Delete payment record ${paymentId}?`)) return;
        const res = await fetch(`${API_URL}/${paymentId}`, { method: 'DELETE' });
        if (res.ok) {
            showAlert('Payment record deleted!');
            loadPayments();
        } else {
            showAlert('Failed to delete record', 'danger');
        }
    }

    loadPayments();
</script>
</body>
</html>
